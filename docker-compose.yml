services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pusher_messaging
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Rate limit counters shared by all API processes (REDIS_URL in apps/server/.env).
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The realtime server (apps/realtime-server-phoenix). `pnpm db:up` starts only the database;
  # run this with `pnpm realtime:phoenix`, or start both with `docker compose up`.
  realtime-phoenix:
    build: ./apps/realtime-server-phoenix
    env_file:
      - path: ./apps/server/.env # PHOENIX_SHARED_SECRET, shared with the API
        required: false
    environment:
      PORT: "4000"
      API_URL: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"

volumes:
  pgdata:
  redisdata:
